<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>cavernous</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; overflow: hidden; }
    main { width: min(72vw, 470px); display: flex; flex-direction: column; align-items: center; }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    h1 { margin: clamp(54px, 9vw, 100px) 0 0; color: #fff; font: 700 clamp(24px, 5.2vw, 56px)/1 Helvetica, Arial, sans-serif; letter-spacing: -0.035em; }
    @media (max-width: 600px) { main { width: min(78vw, 360px); } h1 { margin-top: 64px; font-size: clamp(28px, 8vw, 44px); } }
  </style>
</head>
<body>
  <main aria-label="cavernous">
    <svg viewBox="0 0 620 510" role="img" aria-label="Two overlapping circles with a white crescent on the left">
      <defs>
        <mask id="crescent">
          <rect width="620" height="510" fill="white"/>
          <circle cx="360" cy="255" r="240" fill="black"/>
        </mask>
      </defs>
      <circle cx="260" cy="255" r="240" fill="#fff" mask="url(#crescent)"/>
      <circle cx="260" cy="255" r="240" fill="none" stroke="#fff" stroke-width="2.5"/>
      <circle cx="360" cy="255" r="240" fill="none" stroke="#fff" stroke-width="2.5"/>
    </svg>
    <h1>cavernous</h1>
  </main>
</body>
</html>
